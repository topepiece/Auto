name: Post reels

on:
  schedule:
    - cron: "7,37 * * * *"   # checks twice every hour
  workflow_dispatch:
    inputs:
      force:
        description: "Post the next reel RIGHT NOW (ignore the schedule)"
        type: boolean
        default: false
      dry_run:
        description: "TEST ONLY: write the caption but do NOT post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reel-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Post if a reel is due
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python autoposter.py

      - name: Save progress
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "reel-bot: update progress"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
